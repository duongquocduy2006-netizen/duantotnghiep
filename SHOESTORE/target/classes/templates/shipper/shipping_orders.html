<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang Giao Hàng | S-SHIPPER</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" th:href="@{/css/shipper-style.css}">
    
    <style>
        /* PAGE SPECIFIC STYLES */
        .page-header { margin-bottom: 30px; }
        .page-title { font-family: var(--font-display) !important; font-size: 32px; font-weight: 700; text-transform: uppercase; }
        .page-title span { color: var(--accent-cyan); }

        .active-order {
            background: var(--bg-glass); border: 2px solid var(--accent-cyan); border-radius: 24px;
            padding: 35px; margin-bottom: 30px; position: relative; overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }
        
        .order-status {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }
        .status-badge {
            background: rgba(0, 212, 255, 0.1); color: var(--accent-cyan); border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        }

        /* Progress Steps */
        .progress-steps { display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; }
        .progress-steps::before { content: ''; position: absolute; top: 25px; left: 50px; right: 50px; height: 2px; background: #333; z-index: 1; }
        .step { z-index: 2; text-align: center; width: 100px; }
        .step-icon {
            width: 50px; height: 50px; background: #222; border: 2px solid #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 18px; color: var(--text-muted);
        }
        .step.active .step-icon { background: var(--accent-cyan); border-color: var(--accent-cyan); color: #000; box-shadow: 0 0 15px var(--accent-cyan); }
        .step.done .step-icon { background: #333; border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .step-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
        .step.active .step-label { color: var(--accent-cyan); }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-call { background: transparent; border: 1px solid #333; color: #fff; padding: 15px; border-radius: 12px; font-family: var(--font-display) !important; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-call:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-finish { background: var(--accent-cyan); border: none; color: #000; padding: 15px; border-radius: 12px; font-family: var(--font-display) !important; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-finish:hover { background: #fff; box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3); transform: translateY(-2px); }

    </style>
</head>

<body>
    <aside th:replace="~{shipper/fragments/sidebar :: sidebar('shipping')}"></aside>

    <main class="main">
        <header th:replace="~{shipper/fragments/header :: header}"></header>

        <section class="content">
            <div class="page-header">
                <h2 class="page-title">ĐƠN HÀNG <span>ĐANG GIAO</span></h2>
                <p style="color: var(--text-muted); font-size: 14px;">Bạn có 5 đơn hàng trên lộ trình giao.</p>
            </div>

            <!-- ACTIVE ORDER 1 -->
            <div class="active-order">
                <div class="order-status">
                    <div>
                        <span style="font-family: var(--font-display); font-size: 20px; font-weight: 700; color: #fff;">#ORD-A89F21</span>
                        <p style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">Khách: Nguyễn Văn A • 0901xxxxxx</p>
                    </div>
                    <span class="status-badge">Trên lộ trình</span>
                </div>

                <div class="progress-steps">
                    <div class="step done">
                        <div class="step-icon"><i class="bi bi-box-seam"></i></div>
                        <span class="step-label">Lấy hàng</span>
                    </div>
                    <div class="step active">
                        <div class="step-icon"><i class="bi bi-truck"></i></div>
                        <span class="step-label">Đang giao</span>
                    </div>
                    <div class="step">
                        <div class="step-icon"><i class="bi bi-check2-circle"></i></div>
                        <span class="step-label">Hoàn tất</span>
                    </div>
                </div>

                <div style="background: rgba(255,255,255,0.03); border-radius: 12px; padding: 20px; margin-bottom: 30px;">
                    <p style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px;">Địa chỉ giao hàng</p>
                    <p style="font-size: 15px; font-weight: 500;"><i class="bi bi-geo-alt me-2 text-info"></i> 123 Lê Lợi, Quận 1, TP. HCM</p>
                    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 15px 0;">
                    <p style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px;">Số tiền thu hộ (COD)</p>
                    <p style="font-size: 20px; font-weight: 700; color: #00ff88;">1,250,000đ</p>
                </div>

                <div class="action-grid">
                    <button class="btn-call"><i class="bi bi-telephone"></i> Gọi khách hàng</button>
                    <button class="btn-finish">Xác nhận giao thành công</button>
                </div>
            </div>

            <!-- ACTIVE ORDER 2 (Collapsed/Short) -->
             <div class="active-order" style="padding: 25px; border-color: rgba(255,255,255,0.1); border-style: dashed; opacity: 0.8;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="font-family: var(--font-display); font-size: 16px; font-weight: 600; color: #fff;">#ORD-B77E33</span>
                        <p style="font-size: 12px; color: var(--text-muted);">45 Nguyễn Huệ, Quận 1 • Coi chi tiết <i class="bi bi-arrow-right"></i></p>
                    </div>
                    <span style="font-size: 14px; font-weight: 700; color: var(--accent-cyan);">ĐÃ TT (0₫)</span>
                </div>
             </div>
        </section>
    </main>
</body>

</html>
