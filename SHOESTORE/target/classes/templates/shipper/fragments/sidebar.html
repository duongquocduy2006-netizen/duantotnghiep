<aside th:fragment="sidebar(page)" class="sidebar">
    <a href="/shipper/dashboard" class="logo-area">
        <h1 class="logo-text">SHOE<span>SHIP</span></h1>
    </a>

    <ul class="nav-menu">
        <li class="nav-item">
            <a th:href="@{/shipper/dashboard}" class="nav-link" th:classappend="${page == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-speedometer2"></i>
                <span>Tổng Quan</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/shipper/waiting-orders}" class="nav-link" th:classappend="${page == 'waiting' ? 'active' : ''}">
                <i class="bi bi-box-seam"></i>
                <span>Đơn Chờ Nhận</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/shipper/shipping-orders}" class="nav-link" th:classappend="${page == 'shipping' ? 'active' : ''}">
                <i class="bi bi-clock-history"></i>
                <span>Đang Giao</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/shipper/completed-orders}" class="nav-link" th:classappend="${page == 'completed' ? 'active' : ''}">
                <i class="bi bi-check2-all"></i>
                <span>Đã Hoàn Thành</span>
            </a>
        </li>
        <li class="nav-item">
            <a th:href="@{/shipper/earnings}" class="nav-link" th:classappend="${page == 'earnings' ? 'active' : ''}">
                <i class="bi bi-wallet2"></i>
                <span>Thu Nhập</span>
            </a>
        </li>
        <li class="nav-item" style="margin-top: 40px;">
            <a th:href="@{/}" class="nav-link">
                <i class="bi bi-house-door"></i>
                <span>Về Trang Chủ</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <a th:href="@{/logout}" class="btn-logout">
            <i class="bi bi-box-arrow-left"></i>
            <span>Rời Ca Trực</span>
        </a>
    </div>
</aside>
