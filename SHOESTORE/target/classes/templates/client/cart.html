<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng | ShoeStore</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        /* --- CINEMATIC THEME VARIABLES --- */
        :root {
            --bg-body: #050505;
            --card-bg: #121212;
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
        }

        /* --- TYPOGRAPHY --- */
        h1,
        h2,
        h3,
        h4,
        h5,
        .price-text,
        .btn-text {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        /* --- CART LAYOUT --- */
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-left: 5px solid var(--accent-red);
            padding-left: 20px;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        /* --- CART ITEM CARD --- */
        .cart-item {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .cart-item:hover {
            border-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .item-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            background: #222;
        }

        .item-details {
            flex: 1;
            padding: 0 20px;
        }

        .item-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .item-name a {
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        .item-name a:hover {
            color: var(--accent-red);
        }

        .item-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Quantity Control */
        .qty-control {
            display: flex;
            align-items: center;
            background: #000;
            border: 1px solid #333;
            border-radius: 50px;
            padding: 5px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .qty-btn:hover {
            background: var(--accent-red);
        }

        .qty-input {
            width: 40px;
            text-align: center;
            background: transparent;
            border: none;
            color: #fff;
            font-weight: 600;
            font-family: 'Oswald', sans-serif;
        }

        .qty-input:focus {
            outline: none;
        }

        .item-price {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-red);
            text-align: right;
            min-width: 120px;
        }

        .btn-remove {
            color: var(--text-muted);
            background: transparent;
            border: none;
            font-size: 18px;
            margin-left: 20px;
            transition: 0.2s;
        }

        .btn-remove:hover {
            color: var(--accent-red);
            transform: scale(1.1);
        }

        /* --- SUMMARY CARD (Right Side) --- */
        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 30px;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
            color: #ccc;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #333;
            font-size: 24px;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
            color: #fff;
        }

        .summary-total span:last-child {
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-red);
            color: #fff;
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 25px;
            transition: var(--transition);
        }

        .checkout-btn:hover {
            background: #b20710;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
            transform: translateY(-2px);
        }

        .promo-input-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .promo-input {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            padding: 10px 15px;
            color: #fff;
            border-radius: 4px;
        }

        .promo-input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .promo-btn {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 0 20px;
            border-radius: 4px;
            font-family: 'Oswald', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }

        .promo-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Free Shipping Bar */
        .free-ship-bar {
            background: #222;
            height: 6px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .free-ship-progress {
            background: linear-gradient(90deg, #ff4b1f, #e50914);
            height: 100%;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
            transition: width 0.5s ease;
        }

        .free-ship-text {
            font-size: 13px;
            margin-bottom: 8px;
            color: #ccc;
        }

        .free-ship-text i {
            color: var(--accent-red);
            margin-right: 5px;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .item-details {
                padding: 15px 0;
            }

            .item-price {
                text-align: center;
                margin: 10px 0;
            }

            .btn-remove {
                margin: 10px 0 0 0;
            }
        }

        /* PREMIUM NOTIFICATION */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .premium-toast {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--accent-red);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            margin-bottom: 10px;
        }

        .premium-toast.show {
            transform: translateX(0);
        }

        .premium-toast i {
            color: var(--accent-red);
            font-size: 20px;
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-item {
            height: 120px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .hover-white:hover {
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div th:replace="~{client/fragments/header :: header}"></div>

    <div class="container cart-container py-5">
        <h2 class="section-title animate__animated animate__fadeInLeft">GIỎ HÀNG CỦA BẠN <span
                id="cartCountLabel"
                style="font-size: 16px; color: #777; vertical-align: middle; margin-left: 10px;"></span></h2>

        <div class="row g-5">
            <div class="col-lg-8 animate__animated animate__fadeInUp">

                <!-- Free Shipping Bar -->
                <div class="mb-4" id="freeShipSection">
                    <div class="free-ship-text" id="freeShipText"></div>
                    <div class="free-ship-bar">
                        <div class="free-ship-progress" id="freeShipProgress" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Loading skeleton -->
                <div id="cartLoading">
                    <div class="skeleton skeleton-item"></div>
                    <div class="skeleton skeleton-item"></div>
                    <div class="skeleton skeleton-item"></div>
                </div>

                <!-- Cart Items sẽ được render bởi JS -->
                <div id="cartItemsContainer" style="display: none;"></div>

                <!-- Empty state -->
                <div id="cartEmpty" class="text-center py-5" style="display: none;">
                    <i class="fa fa-shopping-basket fa-4x text-muted mb-3"></i>
                    <p class="text-muted">Giỏ hàng của bạn đang trống.</p>
                </div>

                <a href="/shop" class="text-decoration-none mt-3 d-inline-block"
                    style="color: var(--text-muted); font-size: 14px;">
                    <i class="fa fa-arrow-left me-2"></i> Tiếp tục mua sắm
                </a>

            </div>

            <div class="col-lg-4 animate__animated animate__fadeInRight animate__delay-1s">
                <div class="summary-card">
                    <h4 class="mb-4" style="border-bottom: 1px solid #333; padding-bottom: 15px;">Tóm tắt đơn hàng</h4>

                    <div class="summary-row">
                        <span>Tạm tính</span>
                        <span id="summarySubtotal">0₫</span>
                    </div>
                    <div class="summary-row">
                        <span>Giảm giá</span>
                        <span class="text-success">-0đ</span>
                    </div>
                    <div class="summary-row">
                        <span>Phí vận chuyển</span>
                        <span id="summaryShipping">30.000₫</span>
                    </div>

                    <div class="promo-input-group">
                        <input type="text" class="promo-input" placeholder="Mã giảm giá">
                        <button class="promo-btn">ÁP DỤNG</button>
                    </div>

                    <div class="summary-total">
                        <span>TỔNG CỘNG</span>
                        <span id="summaryTotal">0₫</span>
                    </div>

                    <button class="checkout-btn" onclick="window.location.href='/checkout'">
                        THANH TOÁN NGAY <i class="fa fa-arrow-right ms-2"></i>
                    </button>

                    <div class="mt-4 text-center">
                        <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Chúng tôi chấp nhận:</p>
                        <div class="d-flex justify-content-center gap-2" style="font-size: 24px; color: #888;">
                            <i class="fa-brands fa-cc-visa hover-white"></i>
                            <i class="fa-brands fa-cc-mastercard hover-white"></i>
                            <i class="fa-brands fa-cc-paypal hover-white"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // =============================================
        // CART PAGE - GỌI API /api/cart ĐỂ RENDER
        // =============================================

        const FREE_SHIP_THRESHOLD = 500000;
        const SHIPPING_FEE = 30000;

        // Format tiền VND
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + '₫';
        }

        // Load giỏ hàng từ API
        function loadCart() {
            fetch('/api/cart', {
                credentials: 'same-origin'
            })
                .then(function(res) {
                    if (res.status === 401 || res.redirected) {
                        window.location.href = '/login';
                        return null;
                    }
                    var contentType = res.headers.get('content-type');
                    if (!contentType || contentType.indexOf('application/json') === -1) {
                        // Không phải JSON → có thể bị redirect sang trang login HTML
                        window.location.href = '/login';
                        return null;
                    }
                    return res.json();
                })
                .then(function(data) {
                    if (!data) return;

                    document.getElementById('cartLoading').style.display = 'none';

                    if (!data.success) {
                        showToast(data.message || 'Lỗi tải giỏ hàng', 'error');
                        return;
                    }

                    var items = data.cartItems;
                    var totalPrice = data.totalPrice;

                    if (!items || items.length === 0) {
                        document.getElementById('cartEmpty').style.display = 'block';
                        document.getElementById('cartItemsContainer').style.display = 'none';
                    } else {
                        document.getElementById('cartEmpty').style.display = 'none';
                        document.getElementById('cartItemsContainer').style.display = 'block';
                        renderCartItems(items);
                    }

                    // Cập nhật label đếm
                    document.getElementById('cartCountLabel').textContent =
                        '(' + (items ? items.length : 0) + ' Sản phẩm)';

                    // Cập nhật summary
                    updateSummary(totalPrice);

                    // Cập nhật free ship bar
                    updateFreeShipBar(totalPrice);

                    // Cập nhật cart badge trên header
                    updateHeaderCartBadge(items);
                })
                .catch(function(err) {
                    console.error('Lỗi load giỏ hàng:', err);
                    document.getElementById('cartLoading').style.display = 'none';
                    showToast('Không thể tải giỏ hàng. Vui lòng thử lại!', 'error');
                });
        }

        // Render danh sách sản phẩm trong giỏ
        function renderCartItems(items) {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';

            items.forEach(function(item) {
                const lineTotal = item.price * item.quantity;
                const imgUrl = item.image_url || 'https://placehold.co/100x100?text=No+Image';
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.id = 'cart-item-' + item.id;

                div.innerHTML =
                    '<img src="' + imgUrl + '" alt="Shoe" class="item-img" onerror="this.onerror=null; this.src=\'https://placehold.co/100x100?text=No+Image\'">' +
                    '<div class="item-details">' +
                        '<div class="item-name"><a href="/details?id=' + item.product_id + '">' + item.product_name + '</a></div>' +
                        '<div class="item-meta">Size: ' + item.size_name + ' | Màu: ' + item.color_name + '</div>' +
                    '</div>' +
                    '<div class="qty-control">' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', ' + (item.quantity - 1) + ', ' + item.stock + ')">-</button>' +
                        '<input type="text" class="qty-input" value="' + item.quantity + '" readonly>' +
                        '<button class="qty-btn" onclick="updateQty(' + item.id + ', ' + (item.quantity + 1) + ', ' + item.stock + ')">+</button>' +
                    '</div>' +
                    '<div class="item-price">' + formatMoney(lineTotal) + '</div>' +
                    '<button class="btn-remove" title="Xóa" onclick="removeItem(' + item.id + ')"><i class="fa fa-trash"></i></button>';

                container.appendChild(div);
            });
        }

        // Cập nhật summary panel
        function updateSummary(totalPrice) {
            const shipping = totalPrice >= FREE_SHIP_THRESHOLD ? 0 : SHIPPING_FEE;
            const grandTotal = totalPrice + shipping;

            document.getElementById('summarySubtotal').textContent = formatMoney(totalPrice);
            document.getElementById('summaryShipping').textContent = shipping === 0 ? '0₫' : formatMoney(shipping);
            document.getElementById('summaryTotal').textContent = formatMoney(grandTotal);
        }

        // Cập nhật thanh free ship
        function updateFreeShipBar(totalPrice) {
            const textEl = document.getElementById('freeShipText');
            const progressEl = document.getElementById('freeShipProgress');

            if (totalPrice < FREE_SHIP_THRESHOLD) {
                const remaining = FREE_SHIP_THRESHOLD - totalPrice;
                textEl.innerHTML = '<i class="fa fa-truck-fast"></i> Mua thêm <b>' + formatMoney(remaining) + '</b> để được Freeship';
                progressEl.style.width = (totalPrice * 100 / FREE_SHIP_THRESHOLD) + '%';
            } else {
                textEl.innerHTML = '<i class="fa fa-truck-fast"></i> Bạn đã đủ điều kiện <b>Miễn phí vận chuyển!</b>';
                progressEl.style.width = '100%';
            }
        }

        // Cập nhật badge số lượng giỏ hàng trên header
        function updateHeaderCartBadge(items) {
            const totalQty = items ? items.reduce((sum, item) => sum + item.quantity, 0) : 0;
            const badge = document.querySelector('.cart-badge');
            if (badge) {
                if (totalQty > 0) {
                    badge.textContent = totalQty;
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        // =============================================
        // CÁC THAO TÁC GIỎ HÀNG - GỌI API
        // =============================================

        // Cập nhật số lượng
        function updateQty(itemId, newQty, stock) {
            if (newQty > stock) {
                showToast('Sản phẩm này chỉ còn ' + stock + ' cái trong kho!', 'error');
                return;
            }

            fetch('/api/cart/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId: itemId, quantity: newQty })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    loadCart(); // Reload lại giỏ hàng từ API
                } else {
                    showToast(data.message || 'Lỗi cập nhật', 'error');
                }
            })
            .catch(err => {
                console.error('Lỗi update:', err);
                showToast('Lỗi kết nối server!', 'error');
            });
        }

        // Xóa sản phẩm khỏi giỏ
        function removeItem(itemId) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?')) return;

            fetch('/api/cart/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itemId: itemId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Animation xóa rồi reload
                    const el = document.getElementById('cart-item-' + itemId);
                    if (el) {
                        el.style.transition = 'all 0.4s ease';
                        el.style.opacity = '0';
                        el.style.transform = 'translateX(-50px)';
                        setTimeout(() => {
                            el.remove();
                            loadCart();
                        }, 400);
                    } else {
                        loadCart();
                    }
                    showToast('Đã xóa sản phẩm khỏi giỏ hàng!');
                } else {
                    showToast(data.message || 'Lỗi xóa sản phẩm', 'error');
                }
            })
            .catch(err => {
                console.error('Lỗi remove:', err);
                showToast('Lỗi kết nối server!', 'error');
            });
        }

        // =============================================
        // TOAST NOTIFICATION
        // =============================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'premium-toast';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = '<i class="fa ' + icon + '"></i> <span>' + message + '</span>';
            container.appendChild(toast);

            // Force reflow
            toast.offsetHeight;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // =============================================
        // KHỞI TẠO - GỌI API KHI TRANG LOAD
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadCart();
        });
    </script>
</body>

</html>
