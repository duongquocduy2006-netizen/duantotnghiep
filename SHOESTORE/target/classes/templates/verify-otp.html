<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực OTP | ShoeStore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --bg-body: #050505;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --input-bg: #1a1a1a;
            --transition: all 0.3s ease;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://static.nike.com/a/images/f_auto/dpr_1.3,cs_srgb/w_1423,c_limit/6f8e7960-466d-4952-a39c-482087596d66/jordan-1-lost-and-found-chicago-release-date.jpg') no-repeat center center/cover;
            filter: blur(10px) brightness(0.3);
            transform: scale(1.1);
            z-index: -1;
        }
        .login-card {
            background: rgba(18, 18, 18, 0.95);
            width: 100%; max-width: 480px; padding: 60px 50px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-top: 4px solid var(--accent-red);
        }
        .main-logo-text { font-family: 'Oswald', sans-serif; font-size: 48px; font-weight: 700; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .main-logo-text span { color: var(--accent-red); }
        
        /* OTP Input Style */
        .otp-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 30px 0;
            padding: 20px;
            background: rgba(26, 26, 26, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .otp-input {
            width: 50px;
            height: 60px;
            background: var(--input-bg);
            border: 1px solid #333;
            color: #fff;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            font-family: 'Oswald', sans-serif;
            transition: var(--transition);
        }
        .otp-input:focus {
            border-color: var(--accent-red);
            background: #2a2a2a;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
            outline: none;
        }
        /* Phân loại các thông báo */
        .custom-alert {
            font-size: 14px;
            padding: 12px;
            border-radius: 4px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 20px;
        }
        .alert-success-custom {
            background: rgba(0, 200, 83, 0.1);
            border: 1px solid #00c853;
            color: #00e676;
        }
        .alert-error-custom {
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid var(--accent-red);
            color: #ff4d4d;
        }

        .btn-action { 
            background: var(--accent-red); color: #fff; 
            font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 18px;
            border: none; width: 100%; padding: 15px; margin-top: 10px; 
            clip-path: polygon(5% 0, 100% 0, 100% 80%, 95% 100%, 0 100%, 0 20%); 
            transition: 0.3s; 
        }
        .btn-action:hover { background: #fff; color: #000; transform: translateY(-3px); }
        #timer { font-family: 'Oswald', sans-serif; font-size: 15px; color: var(--accent-red); margin-top: 25px; letter-spacing: 1px;}
        .auth-link { color: var(--text-muted); text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .auth-link:hover { color: var(--accent-red); }
        .disabled-link { pointer-events: none; opacity: 0.5; color: #555; }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="container d-flex justify-content-center">
        <div class="login-card animate__animated animate__zoomIn">
            <div class="text-center">
                <div class="main-logo-text">XÁC MINH<span> OTP</span></div>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 15px; margin-bottom: 5px;">Mã OTP đã được gửi về email:</p>
                <p style="color: #fff; font-weight: 600; font-size: 18px;" th:text="${session.otp_email}"></p>
            </div>

            <!-- Nơi hiển thị thông báo trả về từ Backend -->
            <div th:if="${error}" class="custom-alert alert-error-custom" th:text="${error}"></div>
            <div th:if="${message}" class="custom-alert alert-success-custom" th:text="${message}"></div>
            
            <!-- Nơi hiển thị lỗi khi User chưa nhập đủ 6 số -->
            <div id="client-error" class="custom-alert alert-error-custom d-none">
                Vui lòng nhập đầy đủ mã OTP 6 số!
            </div>

            <form id="otp-form" th:action="@{/verify-otp}" method="post">
                <div class="otp-container">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" />
                </div>
                <!-- Input ẩn truyền OTP thực tế về Backend -->
                <input type="hidden" name="otp" id="hidden-otp">

                <button type="submit" class="btn-action">Xác nhận mã</button>
            </form>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <a th:href="@{/forgot-password}" class="auth-link">
                    <i class="fa-solid fa-arrow-left"></i> &nbsp;Thay đổi Email
                </a>
                <a th:href="@{/resend-otp}" id="resend-link" class="auth-link disabled-link">
                    Gửi lại mã (<span id="countdown">03:00</span>)
                </a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. COUNTDOWN TIMER (3 PHÚT) ---
        let timeLeft = 180; // 3 phút = 180 giây
        const countdownEl = document.getElementById('countdown');
        const resendLink = document.getElementById('resend-link');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.innerText = "";
                resendLink.innerText = "GỬI MÃ MỚI";
                resendLink.classList.remove('disabled-link');
                resendLink.style.color = "var(--accent-red)";
                resendLink.style.fontWeight = "600";
            } else {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                countdownEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            timeLeft -= 1;
        }, 1000);

        // --- 2. XỬ LÝ NHẬP MÃ OTP 6 Ô VUÔNG ---
        const inputs = document.querySelectorAll('.otp-input');
        const hiddenInput = document.getElementById('hidden-otp');
        const clientError = document.getElementById('client-error');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Chỉ nhận số
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                updateHiddenInput();
                clientError.classList.add('d-none'); // Ẩn thông báo lỗi nếu đang gõ
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // Xóa box trước đó
                        updateHiddenInput();
                    }
                }
            });

            // Cho phép dán (Paste) mã 6 số cùng 1 lúc
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                for (let i = 0; i < pastedData.length; i++) {
                    if (i < inputs.length) {
                        inputs[i].value = pastedData[i];
                    }
                }
                // Focus tới ô cuối cùng vừa dán
                if (pastedData.length > 0) {
                    let focusIndex = pastedData.length - 1;
                    if (focusIndex >= inputs.length) focusIndex = inputs.length - 1;
                    inputs[focusIndex].focus();
                }
                updateHiddenInput();
            });
        });

        function updateHiddenInput() {
            let otp = '';
            inputs.forEach(input => {
                otp += input.value;
            });
            hiddenInput.value = otp;
        }

        // --- 3. BẮT LỖI KHI BẤM XÁC NHẬN MÀ CHƯA NHẬP ĐỦ ---
        document.getElementById('otp-form').addEventListener('submit', function(e) {
            updateHiddenInput();
            const otpCode = hiddenInput.value;
            
            // Nếu chưa nhập đủ 6 số
            if (!otpCode || otpCode.length !== 6) {
                e.preventDefault(); // Chặn gửi Request lên Backend
                
                // Hiển thị khung báo lỗi Javascript
                clientError.classList.remove('d-none');
                
                // Tạo hiệu ứng rung lắc (lấy từ Animate.css)
                const card = document.querySelector('.login-card');
                card.classList.remove('animate__zoomIn');
                card.classList.add('animate__headShake');
                
                // Reset lại animation rung lắc sau 1 giây để có thể rung tiếp lần sau
                setTimeout(() => {
                    card.classList.remove('animate__headShake');
                }, 1000);
            }
        });
    </script>
</body>
</html>
