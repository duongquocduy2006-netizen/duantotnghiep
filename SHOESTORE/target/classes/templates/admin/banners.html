<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Banner | ShoeStore Professional</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* --- THEME CONFIGURATION --- */
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent-red: #e50914;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); font-size: 14px; overflow-x: hidden; }
        h1, h2, h3, h4, h5, .font-oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        .admin-wrapper { display: flex; min-height: 100vh; }
        .main-content { flex-grow: 1; margin-left: 260px; padding: 30px 40px; background-image: radial-gradient(circle at 80% 10%, rgba(0, 242, 255, 0.05) 0%, transparent 40%); display: flex; flex-direction: column; }
        
        /* HEADER */
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        .page-title { font-size: 32px; font-weight: 700; margin: 0; line-height: 1; text-shadow: 0 0 20px rgba(0, 0, 0, 0.5); }
        .sub-title { font-size: 13px; color: var(--accent-cyan); font-weight: 600; letter-spacing: 2px; display: block; margin-bottom: 5px; }

        /* BUTTONS */
        .btn-neon { background: var(--accent-cyan); color: #000; border: none; padding: 12px 25px; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        .btn-neon:hover { background: #fff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.5); }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-red:hover { box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); }

        /* TOOLBAR */
        .toolbar { background: var(--bg-card); padding: 20px; border: 1px solid var(--border-glass); border-radius: var(--radius); display: flex; gap: 15px; align-items: center; margin-bottom: 30px; }
        .search-box { flex-grow: 1; position: relative; }
        .search-input { width: 100%; padding: 12px 15px 12px 45px; background: #050505; border: 1px solid #333; border-radius: 4px; color: #fff; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }

        /* TABLE */
        .table-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 20px; font-weight: 500; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Oswald'; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid #333; }
        td { padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        .item-id { font-family: 'Oswald'; color: var(--accent-cyan); letter-spacing: 1px; font-weight: 600; }

        .action-btn { width: 35px; height: 35px; background: transparent; border: 1px solid #333; color: #888; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; margin-left: 5px; border-radius: 4px; text-decoration: none; }
        .btn-edit:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        .btn-delete:hover { border-color: var(--accent-red); color: var(--accent-red); box-shadow: 0 0 10px rgba(229, 9, 20, 0.3); }

        .alert-success { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); padding: 15px 20px; border-radius: 4px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 500;}
        .alert-error { background: rgba(229, 9, 20, 0.1); color: var(--accent-red); border: 1px solid rgba(229, 9, 20, 0.3); padding: 15px 20px; border-radius: 4px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; font-weight: 500;}

        /* ĐỒNG NHẤT KÍCH CỠ ẢNH THEO YÊU CẦU */
        .banner-img-preview { width: 140px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #333; }
    </style>
</head>

<body>

    <div class="admin-wrapper">
        <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>

        <div class="main-content">
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <div class="page-header" style="margin-top: 20px;">
                <div>
                    <span class="sub-title"><i class="bi bi-images"></i> QUẢN LÝ GIAO DIỆN</span>
                    <h1 class="page-title font-oswald">BANNER</h1>
                </div>
                <a th:href="@{/admin/banners/add}" class="btn-neon">
                    <i class="bi bi-plus-lg"></i> Thêm Giao Diện
                </a>
            </div>

            <div th:if="${message}" class="alert-success">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            </div>
            <div th:if="${error}" class="alert-error">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Lọc nhanh (gõ chữ để tìm)...">
                </div>
            </div>

            <!-- TABLE -->
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Tên chiến dịch</th>
                            <th>Sự kiện / Mùa</th>
                            <th>Thời gian</th>
                            <th>Số lượng ảnh</th>
                            <th>Trạng thái</th>
                            <th style="text-align: right;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr th:if="${#lists.isEmpty(banners)}">
                            <td colspan="7" style="text-align: center; color: #666; padding: 40px;">Chưa có banner nào.</td>
                        </tr>
                        <th:block th:each="banner : ${banners}">
                            <tr class="search-item">
                                <td class="item-id" th:text="'#BNN-' + ${banner.id}"></td>
                                <td style="font-weight: 600; color: #fff;" class="search-name" th:text="${banner.name}"></td>
                                <td th:text="${banner.seasonType != null ? banner.seasonType : 'Mặc định'}"></td>
                                <td>
                                    <div style="font-size: 11px; color: #888;">
                                        Từ: <span th:text="${banner.startDate != null ? #temporals.format(banner.startDate, 'dd/MM/yyyy HH:mm') : '---'}"></span><br>
                                        Đến: <span th:text="${banner.endDate != null ? #temporals.format(banner.endDate, 'dd/MM/yyyy HH:mm') : '---'}"></span>
                                    </div>
                                </td>
                                <td>
                                    <span th:text="${banner.images != null ? banner.images.size() : 0} + ' ảnh'"></span>
                                </td>
                                <td>
                                    <span th:if="${banner.status}" style="color: #4ade80; font-size: 11px; text-transform: uppercase; font-weight: 700;">● Hoạt động</span>
                                    <span th:unless="${banner.status}" style="color: var(--accent-red); font-size: 11px; text-transform: uppercase; font-weight: 700;">● Tạm ẩn</span>
                                </td>
                                <td style="text-align: right;">
                                    <a th:href="@{'/admin/banners/edit/' + ${banner.id}}" class="action-btn btn-edit" title="Sửa"><i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{'/admin/banners/delete/' + ${banner.id}}" class="action-btn btn-delete" title="Xóa" onclick="return confirm('Bạn có chắc muốn xóa chiến dịch này cùng tất cả ảnh không?');"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT TƯƠNG TÁC TÌM KIẾM NHANH -->
    <script>
        document.getElementById('searchInput').addEventListener('input', function() {
            let kw = this.value.toLowerCase();
            let rows = document.querySelectorAll('.search-item');
            
            rows.forEach(row => {
                let name = row.querySelector('.search-name').innerText.toLowerCase();
                if(name.includes(kw)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
