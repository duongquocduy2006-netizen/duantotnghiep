<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Thuộc Tính | ShoeStore Professional</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent-red: #e50914;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 14px;
        }

        h1, h2, h3, h4, .font-oswald {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 30px 40px;
            background-image: radial-gradient(circle at 50% 10%, rgba(229, 9, 20, 0.05) 0%, transparent 40%);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .sub-title {
            font-size: 13px;
            color: var(--accent-cyan);
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 25px;
        }

        .card-title {
            font-size: 18px;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-inline {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-control {
            flex-grow: 1;
            padding: 10px 15px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-cyan);
        }

        .btn-add {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            font-family: 'Oswald';
            cursor: pointer;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-delete {
            color: #555;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-delete:hover {
            color: var(--accent-red);
        }

        .alert {
            padding: 12px 20px;
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid rgba(229, 9, 20, 0.2);
            color: var(--accent-red);
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
        <div class="main-content">
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <div class="page-header">
                <div>
                    <span class="sub-title">CẤU HÌNH HỆ THỐNG</span>
                    <h1 class="page-title font-oswald">QUẢN LÝ THUỘC TÍNH</h1>
                </div>
            </div>

            <div th:if="${error}" class="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="grid-layout">
                <!-- QUẢN LÝ MÀU SẮC -->
                <div class="card">
                    <h3 class="card-title">MÀU SẮC <i class="bi bi-palette"></i></h3>
                    <form th:action="@{/admin/attributes/color/save}" method="POST" class="form-inline">
                        <input type="text" name="name" class="form-control" placeholder="Nhập tên màu mới..." required>
                        <button type="submit" class="btn-add">THÊM</button>
                    </form>
                    <table>
                        <thead>
                            <tr>
                                <th>Tên màu</th>
                                <th style="text-align: right;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${colors}">
                                <td th:text="${c.colorName}">Màu đen</td>
                                <td style="text-align: right;">
                                    <a th:href="@{'/admin/attributes/color/delete/' + ${c.id}}" class="btn-delete" 
                                       onclick="return confirm('Xóa màu này? Lưu ý: Nếu có sản phẩm đang dùng màu này, việc xóa sẽ bị từ chối.')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- QUẢN LÝ KÍCH CỠ -->
                <div class="card">
                    <h3 class="card-title">KÍCH CỠ <i class="bi bi-rulers"></i></h3>
                    <form th:action="@{/admin/attributes/size/save}" method="POST" class="form-inline">
                        <input type="text" name="name" class="form-control" placeholder="Nhập size mới (VD: 45)..." required>
                        <button type="submit" class="btn-add">THÊM</button>
                    </form>
                    <table>
                        <thead>
                            <tr>
                                <th>Kích cỡ</th>
                                <th style="text-align: right;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${sizes}">
                                <td th:text="${s.sizeName}">40</td>
                                <td style="text-align: right;">
                                    <a th:href="@{'/admin/attributes/size/delete/' + ${s.id}}" class="btn-delete"
                                       onclick="return confirm('Xóa size này?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
