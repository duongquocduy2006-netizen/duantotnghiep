<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Thông tin Flash Sale | ShoeStore Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent-red: #e50914;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 14px;
        }

        h1,
        h2,
        h3,
        .font-oswald {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 30px 40px;
            background-image: radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.05) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 25px;
            border-radius: var(--radius);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 12px;
            color: #fff;
            outline: none;
            border-radius: 4px;
            transition: 0.3s;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .btn-neon {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-family: 'Oswald';
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-neon:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .product-selector {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed #444;
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .product-item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
        }

        .remove-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--accent-red);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
        }

        .remove-btn:hover {
            background: var(--accent-red);
            color: #fff;
        }

        .error-msg {
            color: var(--accent-red);
            font-size: 12px;
            margin-top: 5px;
            display: block;
            font-weight: 500;
        }

        .form-input.is-invalid {
            border-color: var(--accent-red);
        }

        /* --- FIX: Date Picker Icon Visibility --- */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.5);
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* --- Better Placeholder --- */
        ::placeholder {
            color: #555 !important;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
        <div class="main-content">
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <div style="margin-top: 20px; margin-bottom: 30px;">
                <span class="sub-title"
                    style="font-size: 13px; color: var(--accent-cyan); font-weight: 600; letter-spacing: 2px;">
                    <i class="bi bi-pencil-square"></i> FLASH SALE EDITOR
                </span>
                <h1 class="font-oswald" style="font-size: 32px;"
                    th:text="${flashSale.id == null ? 'TẠO FLASH SALE MỚI' : 'CHỈNH SỬA FLASH SALE'}">EDIT FLASH SALE
                </h1>
            </div>

            <form th:action="@{/admin/flashsales/save}" th:object="${flashSale}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="card">
                    <h3 class="font-oswald" style="margin-bottom: 25px; color: var(--accent-cyan);">Thông tin cơ bản
                    </h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label">Tên chương trình</label>
                            <input type="text" th:field="*{name}"
                                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" class="form-input"
                                placeholder="Ví dụ: Flash Sale Cuối Tuần" />
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-msg"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Trạng thái</label>
                            <select th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'"
                                class="form-input">
                                <option value="1">Kích hoạt (Hoạt động nếu trong thời gian)</option>
                                <option value="0">Tạm dừng</option>
                            </select>
                            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error-msg"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ngày bắt đầu</label>
                            <input type="datetime-local" th:field="*{startDate}"
                                th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'" class="form-input" />
                            <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"
                                class="error-msg"></span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Ngày kết thúc</label>
                            <input type="datetime-local" th:field="*{endDate}"
                                th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'" class="form-input" />
                            <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"
                                class="error-msg"></span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 class="font-oswald" style="color: var(--accent-cyan); margin: 0;">Sản phẩm tham gia</h3>
                        <button type="button" class="btn-neon" style="font-size: 12px; padding: 8px 15px;"
                            onclick="addProductRow()">
                            <i class="bi bi-plus-circle"></i> Thêm sản phẩm
                        </button>
                    </div>

                    <div id="product-list-container">
                        <!-- Header -->
                        <div class="product-item-row"
                            style="border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px;">
                            <div class="form-label" style="margin: 0;">Sản phẩm</div>
                            <div class="form-label" style="margin: 0;">Giá Sale (đ)</div>
                            <div class="form-label" style="margin: 0;">Giới hạn (Số lượng)</div>
                            <div></div>
                        </div>

                        <!-- Rows for existing products -->
                        <div th:each="fsp, iter : *{flashSaleProducts}" class="product-item-row js-product-row">
                            <input type="hidden" th:field="*{flashSaleProducts[__${iter.index}__].id}" />
                            <input type="hidden" th:field="*{flashSaleProducts[__${iter.index}__].soldQuantity}" />
                            <div>
                                <select th:field="*{flashSaleProducts[__${iter.index}__].product.id}"
                                    th:classappend="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].product.id')} ? 'is-invalid'"
                                    class="form-input js-product-select" onchange="updateStockMeta(this)">
                                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName}"
                                        th:data-stock="${p.getTotalStock()}">Sản phẩm</option>
                                </select>
                                <div class="small text-muted mt-1 js-stock-info"
                                    th:text="'Kho hiện có: ' + ${fsp.product.getTotalStock()}">Kho hiện có: 0</div>
                                <span th:if="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].product.id')}"
                                    th:errors="*{flashSaleProducts[__${iter.index}__].product.id}"
                                    class="error-msg"></span>
                            </div>
                            <div>
                                <input type="number" th:field="*{flashSaleProducts[__${iter.index}__].salePrice}"
                                    th:classappend="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].salePrice')} ? 'is-invalid'"
                                    class="form-input" />
                                <span th:if="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].salePrice')}"
                                    th:errors="*{flashSaleProducts[__${iter.index}__].salePrice}"
                                    class="error-msg"></span>
                            </div>
                            <div>
                                <input type="number" th:field="*{flashSaleProducts[__${iter.index}__].quantityLimit}"
                                    th:classappend="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].quantityLimit')} ? 'is-invalid'"
                                    class="form-input js-qty-limit" th:max="${fsp.product.getTotalStock()}" min="1" />
                                <span
                                    th:if="${#fields.hasErrors('flashSaleProducts[' + iter.index + '].quantityLimit')}"
                                    th:errors="*{flashSaleProducts[__${iter.index}__].quantityLimit}"
                                    class="error-msg"></span>
                            </div>
                            <button type="button" class="remove-btn" onclick="removeProductRow(this)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>

                        <!-- Empty message if no products -->
                        <div id="no-products-msg"
                            th:if="${flashSale.flashSaleProducts == null || flashSale.flashSaleProducts.isEmpty()}"
                            style="text-align: center; padding: 30px; color: #444;">
                            Chưa có sản phẩm nào được chọn tham gia Flash Sale.
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 50px;">
                    <button type="submit" class="btn-neon">Lưu Chiến Dịch</button>
                    <a th:href="@{/admin/flashsales}" class="btn-neon"
                        style="background: transparent; border: 1px solid #333;">Hủy Bỏ</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Template for new row -->
    <template id="product-row-template">
        <div class="product-item-row js-product-row">
            <div>
                <select name="flashSaleProducts[INDEX].product.id" class="form-input js-product-select"
                    onchange="updateStockMeta(this)">
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.productName}"
                        th:data-stock="${p.getTotalStock()}">Sản phẩm</option>
                </select>
                <div class="small text-muted mt-1 js-stock-info">Kho hiện có: 0</div>
            </div>
            <div>
                <input type="number" name="flashSaleProducts[INDEX].salePrice" class="form-input" placeholder="0"
                    required />
            </div>
            <div>
                <input type="number" name="flashSaleProducts[INDEX].quantityLimit" class="form-input js-qty-limit"
                    placeholder="0" required min="1" />
            </div>
            <button type="button" class="remove-btn" onclick="removeProductRow(this)">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </template>

    <script th:inline="javascript">
        function updateStockMeta(select) {
            const row = select.closest('.js-product-row');
            const stock = select.options[select.selectedIndex].dataset.stock || 0;
            const stockInfo = row.querySelector('.js-stock-info');
            const qtyInput = row.querySelector('.js-qty-limit');

            if (stockInfo) {
                stockInfo.innerText = `Kho hiện có: ${stock}`;
            }
            if (qtyInput) {
                qtyInput.max = stock;
                if (parseInt(qtyInput.value) > parseInt(stock)) {
                    qtyInput.value = stock;
                }
            }
        }

        // Initialize for existing rows
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.js-product-select').forEach(sel => updateStockMeta(sel));
        });

        function addProductRow() {
            const container = document.getElementById('product-list-container');
            const template = document.getElementById('product-row-template');
            const noMsg = document.getElementById('no-products-msg');

            if (noMsg) noMsg.style.display = 'none';

            const index = container.querySelectorAll('.js-product-row').length;
            const clone = template.content.cloneNode(true);

            // Replace INDEX with actual index
            const inputs = clone.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.name = input.name.replace('INDEX', index);
            });

            const row = clone.querySelector('.js-product-row');
            container.appendChild(clone);

            // Update newly added row
            const sel = row.querySelector('.js-product-select');
            if (sel) updateStockMeta(sel);
        }

        function removeProductRow(btn) {
            const row = btn.closest('.js-product-row');
            row.remove();

            // Re-index remaining rows
            const container = document.getElementById('product-list-container');
            const rows = container.querySelectorAll('.js-product-row');

            if (rows.length === 0) {
                const noMsg = document.getElementById('no-products-msg');
                if (noMsg) noMsg.style.display = 'block';
            }

            rows.forEach((r, idx) => {
                const inputs = r.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.name = input.name.replace(/\[\d+\]/, `[${idx}]`);
                });
            });
        }
    </script>
</body>

</html>
