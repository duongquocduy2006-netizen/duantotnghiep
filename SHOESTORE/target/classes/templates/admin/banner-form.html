<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Sửa/Thêm Chiến Dịch Banner | ShoeStore Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent-red: #e50914;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); font-size: 14px; overflow-x: hidden; }
        h1, h2, h3, h4, h5, .font-oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        .admin-wrapper { display: flex; min-height: 100vh; }
        .main-content { flex-grow: 1; margin-left: 260px; padding: 30px 40px; background-image: radial-gradient(circle at 50% 10%, rgba(0, 242, 255, 0.05) 0%, transparent 40%); }
        
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        .page-title { font-size: 32px; font-weight: 700; margin: 0; }
        .sub-title { font-size: 13px; color: var(--accent-cyan); font-weight: 600; letter-spacing: 2px; margin-bottom: 5px; }

        .btn-group { display: flex; gap: 15px; }
        .btn-cancel { background: transparent; border: 1px solid #333; color: #ccc; padding: 12px 25px; font-family: 'Oswald'; cursor: pointer; text-decoration: none; }
        .btn-save { background: var(--accent-cyan); color: #000; border: none; padding: 12px 30px; font-family: 'Oswald'; cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); font-weight: 600;}

        .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius); padding: 30px; margin-bottom: 30px; }
        .card-title { font-family: 'Oswald'; font-size: 18px; color: var(--accent-cyan); margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }

        .form-group { margin-bottom: 25px; }
        .form-label { display: block; margin-bottom: 10px; color: #ccc; font-size: 13px; }
        .form-control { width: 100%; padding: 12px 15px; background: #050505; border: 1px solid #333; border-radius: 4px; color: #fff; font-family: 'Poppins'; outline: none; }
        .form-control:focus { border-color: var(--accent-cyan); }
        select option { background-color: #ffffff; color: #000000; }

        .image-upload-box { border: 2px dashed #333; border-radius: var(--radius); padding: 50px 20px; text-align: center; cursor: pointer; background: #0a0a0a; transition: 0.3s; }
        .image-upload-box:hover { border-color: var(--accent-cyan); background: #111; }
        .upload-icon { font-size: 40px; color: #555; margin-bottom: 15px; }
        .file-input { display: none; }
        
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .img-item-wrapper { position: relative; border: 1px solid #333; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        .img-item-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        .btn-remove-img { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: var(--accent-red); border: 1px solid var(--accent-red); width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; text-decoration: none;}
        .btn-remove-img:hover { background: var(--accent-red); color: #fff; }
        
        .alert-success { background: rgba(74, 222, 128, 0.1); border-left: 4px solid #4ade80; color: #4ade80; padding: 15px; margin-bottom: 25px; border-radius: 0 4px 4px 0; }
        
        /* --- FIX: Date Picker Icon Visibility --- */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.5);
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
        <div class="main-content">
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <div th:if="${message}" class="alert-success">
                <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
            </div>

            <form th:action="@{/admin/banners/save}" th:object="${banner}" method="POST" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                
                <div class="page-header" style="margin-top: 20px;">
                    <div>
                        <span class="sub-title">QUẢN LÝ GIAO DIỆN HIỂN THỊ</span>
                        <h1 class="page-title font-oswald">CHIẾN DỊCH BANNER (CAMPAIGN)</h1>
                    </div>
                    <div class="btn-group">
                        <a th:href="@{/admin/banners}" class="btn-cancel">HỦY BỎ</a>
                        <button type="submit" class="btn-save">LƯU CHIẾN DỊCH</button>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="left-col">
                        <div class="card">
                            <h3 class="card-title">THÔNG TIN CHIẾN DỊCH</h3>
                            <div class="form-group">
                                <label class="form-label">Tên chiến dịch *</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Khuyến mãi mùa hè 2026" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Sự kiện / Mùa *</label>
                                <select th:field="*{seasonType}" class="form-control" required>
                                    <option value="">-- Chọn sự kiện --</option>
                                    <option value="Sinh Nhật">Sinh Nhật Store</option>
                                    <option value="Summer Collection">Summer Collection</option>
                                    <option value="Black Friday">Black Friday</option>
                                    <option value="New Arrival">Ra mắt bộ sưu tập mới</option>
                                    <option value="Khác">Khác / Định kỳ</option>
                                </select>
                            </div>

                            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                                <div>
                                    <label class="form-label">Thời gian bắt đầu</label>
                                    <input type="datetime-local" th:field="*{startDate}" class="form-control">
                                </div>
                                <div>
                                    <label class="form-label">Thời gian kết thúc</label>
                                    <input type="datetime-local" th:field="*{endDate}" class="form-control">
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label">Mô tả thêm</label>
                                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Ghi chú nội bộ cho chiến dịch này..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="right-col">
                        <div class="card">
                            <h3 class="card-title">HÌNH ẢNH BANNER (NHIỀU ẢNH)</h3>
                            
                            <!-- Hình ảnh hiện tại (Chỉ hiện khi Edit) -->
                            <div th:if="${banner.images != null and !banner.images.isEmpty()}" style="margin-bottom: 25px;">
                                <label class="form-label">Các ảnh đang sử dụng</label>
                                <div class="preview-grid">
                                    <div class="img-item-wrapper" th:each="img : ${banner.images}">
                                        <img th:src="@{'/images/' + ${img.imageUrl}}" alt="Banner Image">
                                        <a th:href="@{'/admin/banners/image/delete/' + ${img.id} + '/' + ${banner.id}}" 
                                           class="btn-remove-img" title="Xóa ảnh này" 
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa ảnh này khỏi chiến dịch?');">
                                           <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </div>
                                <hr style="border-color: #333; margin: 20px 0;">
                            </div>
                            
                            <label class="form-label" th:text="${banner.images != null and !banner.images.isEmpty() ? 'Tải thêm ảnh cho chiến dịch' : 'Tải lên các ảnh của chiến dịch'}"></label>

                            <div class="image-upload-box" onclick="document.getElementById('fileInput').click()">
                                <input type="file" id="fileInput" name="imageFiles" class="file-input" accept="image/*" multiple onchange="previewImages(event)" onclick="event.stopPropagation()">
                                <div id="upload-placeholder">
                                    <i class="bi bi-cloud-arrow-up upload-icon"></i>
                                    <p style="color: #888; font-size: 12px; margin-bottom: 5px;">BẤM VÀO ĐỂ TẢI LÊN NHIỀU ẢNH</p>
                                    <p style="color: var(--accent-cyan); font-size: 11px;">(Hỗ trợ chọn nhiều file cùng lúc)</p>
                                </div>
                            </div>
                            
                            <!-- Preview images that are going to be uploaded -->
                            <div id="new-images-preview" class="preview-grid"></div>

                            <div class="form-group" style="margin-top: 30px;">
                                <label class="form-label">Trạng thái Chiến dịch</label>
                                <select th:field="*{status}" class="form-control">
                                    <option value="true">Kích hoạt (Hiển thị trang chủ)</option>
                                    <option value="false">Tạm ẩn</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Use DataTransfer to manage the multiple file inputs cleanly
        let dt = new DataTransfer();

        function previewImages(event) {
            let fileInput = document.getElementById('fileInput');
            let previewContainer = document.getElementById('new-images-preview');
            let placeholder = document.getElementById('upload-placeholder');
            
            // Loop through selected files
            for(let i = 0; i < fileInput.files.length; i++) {
                let file = fileInput.files[i];
                dt.items.add(file); // add to our virtual file list
                
                let reader = new FileReader();
                reader.onload = function(e) {
                    let wrapper = document.createElement('div');
                    wrapper.className = 'img-item-wrapper';
                    
                    let img = document.createElement('img');
                    img.src = e.target.result;
                    
                    let removeBtn = document.createElement('a');
                    removeBtn.className = 'btn-remove-img';
                    removeBtn.innerHTML = '<i class="bi bi-x"></i>';
                    removeBtn.title = "Bỏ chọn";
                    // When clicked, remove from virtual list and sync DOM
                    removeBtn.onclick = function() {
                        let fileName = file.name;
                        for(let j = 0; j < dt.items.length; j++) {
                            if(dt.items[j].getAsFile().name === fileName) {
                                dt.items.remove(j);
                                break;
                            }
                        }
                        fileInput.files = dt.files; // sync back to input
                        wrapper.remove();
                    };
                    
                    wrapper.appendChild(img);
                    wrapper.appendChild(removeBtn);
                    previewContainer.appendChild(wrapper);
                };
                reader.readAsDataURL(file);
            }
            
            // Sync final DataTransfer files into the actual file input
            fileInput.files = dt.files;
            placeholder.querySelector('p').innerText = "BẤM VÀO ĐỂ TẢI THÊM ẢNH";
        }
    </script>
</body>
</html>
