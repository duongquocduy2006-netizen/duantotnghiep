spring.application.name=ShoeStore-JAVA5-ASM

# ============================================================
# Datasource – giá trị thực nằm trong file .env
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# Encoding – tránh lỗi font Tiếng Việt
# ============================================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ============================================================
# JPA & Hibernate
# ============================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
# Hibernate 6 tự phát hiện dialect, không cần khai báo thủ công
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================================================
# Google OAuth2
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ============================================================
# Multipart / File Upload
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
# Giới hạn dung lượng tối đa của toàn bộ form gửi lên (bao gồm cả chữ + ảnh)
server.tomcat.max-http-form-post-size=150MB

# ============================================================
# Mail (Gmail SMTP)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# GHN API
# ============================================================
ghn.api.token=${GHN_API_TOKEN}
ghn.api.shopid=${GHN_API_SHOPID}

# ============================================================
# ChatGPT / OpenAI API
# ============================================================
openai.api.key=${OPENAI_API_KEY}

# ============================================================
# PayOS
# ============================================================
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
