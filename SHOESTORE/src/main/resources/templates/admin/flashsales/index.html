<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản Lý Flash Sale | ShoeStore Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #121212;
            --accent-red: #e50914;
            --accent-cyan: #00f2ff;
            --text-main: #ffffff;
            --border-glass: rgba(255, 255, 255, 0.08);
            --radius: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 14px;
        }

        h1, h2, h3, h4, h5, .font-oswald {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
            margin-left: 260px;
            padding: 30px 40px;
            background-image: radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.05) 0%, transparent 40%);
            display: flex;
            flex-direction: column;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            line-height: 1;
        }

        .sub-title {
            font-size: 13px;
            color: var(--accent-cyan);
            font-weight: 600;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }

        .btn-neon {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 12px 25px;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
                    calc(100% - 10px) 100%, 0 100%, 0 10px);
            text-decoration: none;
        }

        .btn-neon:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid #333;
        }

        th {
            text-align: left;
            padding: 20px;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            font-family: 'Oswald';
        }

        td {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        .status-badge {
            padding: 5px 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid;
            border-radius: 4px;
        }

        .status-active {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.1);
        }

        .status-inactive {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.1);
        }

        .action-btn {
            width: 35px;
            height: 35px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            margin-left: 5px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-edit:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-delete:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>

<body>
    <div class="admin-wrapper">
        <aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
        <div class="main-content">
            <header th:replace="~{admin/fragments/header :: header}"></header>

            <div class="page-header" style="margin-top: 20px;">
                <div>
                    <span class="sub-title"><i class="bi bi-lightning-fill"></i> KHUYẾN MÃI</span>
                    <h1 class="page-title font-oswald">QUẢN LÝ FLASH SALE</h1>
                </div>
                <a th:href="@{/admin/flashsales/create}" class="btn-neon"><i class="bi bi-plus-lg"></i> Tạo Flash Sale</a>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th width="30%">Tên chiến dịch</th>
                            <th>Thời gian bắt đầu</th>
                            <th>Thời gian kết thúc</th>
                            <th>Sản phẩm</th>
                            <th>Trạng thái</th>
                            <th style="text-align: right;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="fs : ${flashSales}">
                            <td>
                                <span class="font-oswald" style="font-size: 16px; color: #fff;" th:text="${fs.name}">Tên Flash Sale</span>
                                <br>
                                <small style="color: #666;" th:text="'ID: #' + ${fs.id}">ID: #1</small>
                            </td>
                            <td th:text="${#temporals.format(fs.startDate, 'dd/MM/yyyy HH:mm')}">01/01/2024 00:00</td>
                            <td th:text="${#temporals.format(fs.endDate, 'dd/MM/yyyy HH:mm')}">01/01/2024 23:59</td>
                            <td th:text="${fs.flashSaleProducts != null ? fs.flashSaleProducts.size() : 0}">0</td>
                            <td>
                                <span th:if="${fs.status == 1}" class="status-badge status-active">Hoạt động</span>
                                <span th:if="${fs.status == 0}" class="status-badge status-inactive">Tạm ngưng</span>
                                <br/>
                                <small th:if="${fs.status == 1 && T(java.time.LocalDateTime).now().isAfter(fs.startDate) && T(java.time.LocalDateTime).now().isBefore(fs.endDate)}" 
                                       style="color: var(--accent-cyan);">● Đang diễn ra</small>
                                <small th:if="${fs.status == 1 && T(java.time.LocalDateTime).now().isBefore(fs.startDate)}" 
                                       style="color: #fbbf24;">● Sắp diễn ra</small>
                                <small th:if="${fs.status == 1 && T(java.time.LocalDateTime).now().isAfter(fs.endDate)}" 
                                       style="color: #f87171;">● Đã kết thúc</small>
                            </td>
                            <td style="text-align: right;">
                                <a th:href="@{/admin/flashsales/edit/{id}(id=${fs.id})}" class="action-btn btn-edit" title="Chỉnh sửa">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/flashsales/delete/{id}(id=${fs.id})}" class="action-btn btn-delete" title="Xóa"
                                    onclick="return confirm('Xếp chắc chắn muốn xóa Flash Sale này chứ?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(flashSales)}">
                            <td colspan="6" style="text-align: center; padding: 50px; color: #555;">
                                <i class="bi bi-lightning" style="font-size: 3rem; display: block; margin-bottom: 10px;"></i>
                                Chưa có Flash Sale nào được tạo.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
