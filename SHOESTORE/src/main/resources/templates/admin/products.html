<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
	<meta charset="UTF-8">
	<title>Quản Lý Sản Phẩm | ShoeStore Professional</title>

	<link
		href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

	<style>
		:root {
			--bg-body: #050505;
			--bg-card: #121212;
			--accent-red: #e50914;
			--accent-cyan: #00f2ff;
			--text-main: #ffffff;
			--border-glass: rgba(255, 255, 255, 0.08);
			--radius: 6px;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: 'Poppins', sans-serif;
			background-color: var(--bg-body);
			color: var(--text-main);
			font-size: 14px;
		}

		h1, h2, h3, h4, h5, .font-oswald {
			font-family: 'Oswald', sans-serif;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.admin-wrapper { display: flex; min-height: 100vh; }

		.main-content {
			flex-grow: 1; margin-left: 260px; padding: 30px 40px;
			background-image: radial-gradient(circle at 50% 0%, rgba(229, 9, 20, 0.05) 0%, transparent 40%);
			display: flex; flex-direction: column;
		}

		.page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }

		.page-title { font-size: 32px; font-weight: 700; margin: 0; line-height: 1; }

		.sub-title { font-size: 13px; color: var(--accent-cyan); font-weight: 600; letter-spacing: 2px; display: block; margin-bottom: 5px; }

		.btn-neon {
			background: var(--accent-red); color: white; border: none; padding: 12px 25px;
			font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase;
			cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
			clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
			text-decoration: none;
		}

		.btn-neon:hover { background: #fff; color: #000; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }

		.table-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius); overflow: hidden; }

		table { width: 100%; border-collapse: collapse; }
		thead { background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid #333; }
		th { text-align: left; padding: 20px; color: #666; font-size: 11px; text-transform: uppercase; font-family: 'Oswald'; }
		td { padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }

		.product-item { display: flex; align-items: center; gap: 15px; }
		.product-img { width: 60px; height: 60px; object-fit: cover; border: 1px solid #333; border-radius: 4px; background: #222; }
		.product-name { font-weight: 600; color: var(--text-main); display: block; font-size: 15px; font-family: 'Oswald'; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.product-id { font-size: 11px; color: #666; }

		.price { font-weight: 600; color: var(--accent-cyan); font-family: 'Oswald'; font-size: 16px; }

		.status-badge { padding: 5px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: 1px solid; border-radius: 4px; }
		.status-active { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); background: rgba(74, 222, 128, 0.1); }

		.action-btn {
			width: 35px; height: 35px; background: transparent; border: 1px solid #333; color: #888;
			display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
			transition: 0.3s; margin-left: 5px; text-decoration: none; border-radius: 4px;
		}

		.btn-edit:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
		.btn-delete:hover { border-color: var(--accent-red); color: var(--accent-red); }

		/* SPA Additions */
		#toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
		.admin-toast { background: #333; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
		.admin-toast.show { transform: translateX(0); opacity: 1; }
		.toast-success { border-left: 4px solid #4ade80; }
		.toast-error { border-left: 4px solid var(--accent-red); }

		.search-filter-box { position: relative; width: 300px; }
		.search-filter-box input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px 15px 10px 40px; border-radius: 6px; outline: none; transition: 0.3s; font-family: 'Poppins'; }
		.search-filter-box input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }
		.search-filter-box i { position: absolute; left: 15px; top: 12px; color: #666; transition: 0.3s; }
		.search-filter-box input:focus + i { color: var(--accent-cyan); }
	</style>
</head>

<body>
	<div class="admin-wrapper">
		<aside th:replace="~{admin/fragments/sidebar :: sidebar}"></aside>
		
        <div class="main-content">
			<header th:replace="~{admin/fragments/header :: header}"></header>

			<div class="page-header" style="margin-top: 20px;">
				<div>
					<span class="sub-title"><i class="bi bi-box-seam"></i> KHO HÀNG</span>
					<h1 class="page-title font-oswald">DANH SÁCH SẢN PHẨM</h1>
				</div>
				<div style="display:flex; gap: 15px; align-items: center;">
                    <div class="search-filter-box">
                        <input type="text" id="searchInput" autocomplete="off" placeholder="Tìm tên, mã code, hãng giày...">
                        <i class="bi bi-search"></i>
                    </div>
				    <a th:href="@{/admin/products/create}" class="btn-neon"><i class="bi bi-plus-lg"></i> Thêm SP Mới</a>
                </div>
			</div>

			<div class="table-card">
				<table>
					<thead>
						<tr>
							<th width="35%">Thông tin sản phẩm</th>
							<th>Danh mục</th>
							<th>Giá niêm yết</th>
							<th>Kho hàng</th>
							<th>Trạng thái</th>
							<th style="text-align: right;">Thao tác</th>
						</tr>
					</thead>
					<tbody id="productTableBody">
						<tr><td colspan="6" style="text-align: center; padding: 50px;"><div class="spinner-border text-info" role="status"></div></td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

    <script>
        let allProducts = [];

		document.addEventListener('DOMContentLoaded', () => {
			loadProducts();
			
			// Thanh tìm kiếm tức thời
			document.getElementById('searchInput').addEventListener('input', function(e) {
				const keyword = e.target.value.toLowerCase();
				const filtered = allProducts.filter(p => 
					(p.productName && p.productName.toLowerCase().includes(keyword)) || 
					(p.productCode && p.productCode.toLowerCase().includes(keyword)) ||
					(p.brandName && p.brandName.toLowerCase().includes(keyword)) ||
					(p.categoryName && p.categoryName.toLowerCase().includes(keyword))
				);
				renderTable(filtered);
			});
		});

		function loadProducts() {
			fetch('/api/products')
			.then(res => res.json())
			.then(data => {
				if (!data.success) {
					showToast('Lỗi từ server: ' + (data.message || 'Không xác định'), 'error');
					return;
				}
				const products = data.products || [];
				allProducts = products;
				renderTable(products);
			})
			.catch(err => {
				showToast('Lỗi tải danh sách Sản phẩm API!', 'error');
                console.error(err);
			});
		}

		function renderTable(data) {
			const tbody = document.getElementById('productTableBody');
			tbody.innerHTML = '';

			if(data.length === 0) {
				tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 50px; color: #555;"><i class="bi bi-inbox" style="font-size: 3rem; display: block; margin-bottom: 10px;"></i>Không tìm thấy dữ liệu hoặc Đang chạy API.</td></tr>`;
				return;
			}

			data.forEach(p => {
				// Đọc cả camelCase (mới) lẫn snake_case (cũ) để backward-compatible
				const productName  = p.productName  || p.product_name  || '(Không có tên)';
				const productCode  = p.productCode  || p.product_code  || '';
				const brandName    = p.brandName    || p.brand_name    || '';
				const categoryName = p.categoryName || p.category_name || '';
				const imageUrl     = p.imageUrl     || p.image_url     || '';
				const price        = p.price        || p.min_price     || null;
				const variantCount = p.variantCount !== undefined ? p.variantCount : (p.variant_count || 0);
				const status       = p.status !== undefined ? p.status : 1;

				let statusHtml = status === 1
					? `<span class="status-badge status-active">Đang bán</span>`
					: `<span class="status-badge" style="color:#facc15; border-color:rgba(250,204,21,0.3); background:rgba(250,204,21,0.1)">Tạm ẩn</span>`;

                let priceHtml = price
                    ? new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price)
                    : `<span style="font-size: 13px; color: #888;">Chưa nhập giá</span>`;

				let row = `
				<tr>
					<td>
						<div class="product-item">
							<img src="${imageUrl}" class="product-img" alt="IMG" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22%23222%22/><text x=%2230%22 y=%2235%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2212%22>IMG</text></svg>'">
							<div>
								<span class="product-name" title="${productName}">${productName}</span>
								<span class="product-id"><i class="bi bi-upc-scan"></i> SKU: <span>${productCode}</span></span>
							</div>
						</div>
					</td>
					<td>
						<span style="color: #ccc">${categoryName}</span><br>
						<small style="color: #888; font-size: 11px;">${brandName}</small>
					</td>
					<td class="price">${priceHtml}</td>
					<td style="color: #fff; font-weight: 600;">${variantCount > 0 ? variantCount + ' phân loại' : 'Chưa cập nhật'}</td>
					<td>${statusHtml}</td>
					<td style="text-align: right;">
						<a href="/admin/products/detail/${p.id}" class="action-btn" title="Xem chi tiết" style="color: var(--accent-cyan); border-color: var(--accent-cyan);"><i class="bi bi-eye"></i></a>
						<a href="/admin/products/edit/${p.id}" class="action-btn btn-edit" title="Chỉnh sửa"><i class="bi bi-pencil-square"></i></a>
						<button onclick="deleteProduct(${p.id}, '${productName.replace(/'/g, "\\'")}')" class="action-btn btn-delete" title="Xóa"><i class="bi bi-trash"></i></button>
					</td>
				</tr>
				`;
				tbody.insertAdjacentHTML('beforeend', row);
			});
		}

		function deleteProduct(id, name) {
			if(confirm(`Xếp có chắc chắn muốn xóa vĩnh viễn sản phẩm [${name}] không? Hành động này sẽ bay màu dứt điểm cả Hình ảnh và Biến thể!`)) {
				fetch('/api/products/' + id, { method: 'DELETE' })
				.then(res => res.json())
				.then(response => {
					if(response.status === 'success') {
						showToast(response.message, 'success');
						loadProducts();
					} else {
						showToast(response.error || 'Lỗi hệ thống không thể xóa!', 'error');
					}
				})
				.catch(err => {
					showToast('Lỗi đường gốc API, vui lòng báo Code!', 'error');
                    console.error(err);
				});
			}
		}

		function showToast(msg, type='success') {
			let container = document.getElementById('toast-container');
			if(!container) {
				container = document.createElement('div');
				container.id = 'toast-container';
				document.body.appendChild(container);
			}
			const toast = document.createElement('div');
			toast.className = `admin-toast toast-${type}`;
			let icon = type === 'success' ? '<i class="bi bi-check-circle-fill" style="color:#4ade80; font-size:20px;"></i>' : '<i class="bi bi-x-circle-fill" style="color:var(--accent-red); font-size:20px;"></i>';
			
			toast.innerHTML = `${icon} <div><strong style="display:block; font-size:14px; margin-bottom:3px; font-family:'Oswald'">${type === 'success' ? 'THÀNH CÔNG' : 'LỖI'}</strong><span style="font-size:12px; color:#ccc;">${msg}</span></div>`;
			
			container.appendChild(toast);
			setTimeout(() => { toast.classList.add('show'); }, 10);
			setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
		}
    </script>
</body>
</html>
