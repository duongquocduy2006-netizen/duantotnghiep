<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quên Mật Khẩu | ShoeStore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --bg-body: #050505;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --input-bg: #1a1a1a;
            --transition: all 0.3s ease;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-body); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://static.nike.com/a/images/f_auto/dpr_1.3,cs_srgb/w_1423,c_limit/6f8e7960-466d-4952-a39c-482087596d66/jordan-1-lost-and-found-chicago-release-date.jpg') no-repeat center center/cover; filter: blur(10px) brightness(0.3); transform: scale(1.1); z-index: -1; }
        .login-card { background: rgba(18, 18, 18, 0.95); width: 100%; max-width: 480px; padding: 60px 50px; position: relative; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8); border-top: 4px solid var(--accent-red); }
        .main-logo-text { font-family: 'Oswald', sans-serif; font-size: 44px; font-weight: 700; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .main-logo-text span { color: var(--accent-red); }
        
        .main-logo-icon {
            font-size: 32px; color: var(--accent-red); margin-right: 12px; transform: rotate(-15deg);
        }

        .form-label { font-family: 'Oswald', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
        .custom-input { background: var(--input-bg); border: 1px solid #333; color: #fff; padding: 15px; border-radius: 0; transition: var(--transition); font-size: 16px; }
        .custom-input:focus { border-color: var(--accent-red); background: #2a2a2a; box-shadow: 0 0 10px rgba(229, 9, 20, 0.3); color: #fff; outline: none; }
        
        .custom-alert { font-size: 14px; padding: 12px; border-radius: 4px; font-weight: 500; text-align: center; margin-bottom: 25px; transition: var(--transition); }
        .alert-error-custom { background: rgba(229, 9, 20, 0.1); border: 1px solid var(--accent-red); color: #ff4d4d; }

        .btn-action { background: var(--accent-red); color: #fff; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 18px; border: none; width: 100%; padding: 15px; margin-top: 15px; clip-path: polygon(5% 0, 100% 0, 100% 80%, 95% 100%, 0 100%, 0 20%); transition: 0.3s; }
        .btn-action:hover { background: #fff; color: #000; transform: translateY(-3px); }
        .back-home { position: absolute; top: 40px; left: 40px; color: #fff; text-decoration: none; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 14px; transition: 0.3s; z-index: 10; opacity: 0.8; }
        .back-home:hover { color: var(--accent-red); opacity: 1; transform: translateX(-5px); }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <a th:href="@{/login}" class="back-home animate__animated animate__fadeInDown">
        <i class="fa-solid fa-arrow-left-long"></i> TRỞ VỀ ĐĂNG NHẬP
    </a>

    <div class="container d-flex justify-content-center">
        <div class="login-card animate__animated animate__zoomIn">
            <div class="text-center mb-4">
                <div class="main-logo-text">
                    <i class="fa-solid fa-shoe-prints main-logo-icon"></i>Shoe<span>Store</span>
                </div>
                <p style="color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Khôi phục mật khẩu</p>
            </div>

            <!-- Lỗi từ Backend -->
            <div th:if="${error}" class="custom-alert alert-error-custom" th:text="${error}"></div>
            
            <!-- Lỗi từ Frontend -->
            <div id="client-error" class="custom-alert alert-error-custom d-none"></div>

            <form id="forgot-form" th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label">Nhập email của bạn</label>
                    <input type="email" id="email" name="email" class="form-control custom-input" placeholder="email@example.com">
                </div>
                <button type="submit" class="btn-action">Gửi mã xác thực</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('forgot-form');
        const emailInput = document.getElementById('email');
        const clientError = document.getElementById('client-error');
        const card = document.querySelector('.login-card');

        // Regex đơn giản để check định dạng email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        emailInput.addEventListener('input', () => {
            clientError.classList.add('d-none');
        });

        form.addEventListener('submit', function(e) {
            let errorMsg = '';
            const emailVal = emailInput.value.trim();

            if (!emailVal) {
                errorMsg = 'Vui lòng nhập địa chỉ email!';
            } else if (!emailRegex.test(emailVal)) {
                errorMsg = 'Địa chỉ email không hợp lệ!';
            }

            if (errorMsg !== '') {
                e.preventDefault(); 
                clientError.innerText = errorMsg;
                clientError.classList.remove('d-none');

                card.classList.remove('animate__zoomIn');
                card.classList.add('animate__headShake');
                setTimeout(() => {
                    card.classList.remove('animate__headShake');
                }, 1000);
            }
        });
    </script>
</body>
</html>
