<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm bằng hình ảnh (AI)</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .form-control {
            margin-bottom: 20px;
        }

        .result-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #ebebeb;
            padding: 15px;
            border-radius: 12px;
            width: 220px;
            background: #fff;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .ai-attributes {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #000;
        }

        .btn-submit {
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: 0;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }

        .error-message {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .info-message {
            color: #0c5460;
            background: #d1ecf1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        h1,
        h3 {
            color: #222;
        }

        .price {
            color: #e74c3c;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔍 Tìm kiếm giày bằng AI</h1>
        <p>Tải lên một hình ảnh và AI sẽ tìm đôi giày tương tự trong kho hàng!</p>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/search/image}" method="post" enctype="multipart/form-data" class="form-control">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit" class="btn-submit">Tìm kiếm ngay</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <div th:if="${aiResult != null}">
            <div class="info-message" th:if="${info}" th:text="${info}"></div>

            <h3>1. Thông tin trích xuất từ hình ảnh</h3>
            <div style="display: flex; gap: 30px; margin-bottom: 40px; align-items: start;">
                <img th:src="${uploadedImage}"
                    style="max-height: 250px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);"
                    alt="Uploaded">

                <div class="ai-attributes">
                    <h4 style="margin-top: 0">Kết quả phân tích JSON</h4>
                    <p><b>Thương hiệu:</b> <span
                            th:text="${aiResult.brand != '' ? aiResult.brand : 'Không xác định'}"></span></p>
                    <p><b>Màu sắc:</b> <span
                            th:text="${aiResult.color != '' ? aiResult.color : 'Không xác định'}"></span></p>
                    <p><b>Loại giày:</b> <span
                            th:text="${aiResult.category != '' ? aiResult.category : 'Không xác định'}"></span></p>
                    <p><b>Phong cách:</b> <span
                            th:text="${aiResult.style != '' ? aiResult.style : 'Không xác định'}"></span></p>
                </div>
            </div>

            <h3>2. Top sản phẩm tương đồng cao nhất</h3>
            <div class="result-grid">
                <div class="product-card" th:each="product : ${products}">
                    <div
                        style="height: 180px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; border-radius: 8px; margin-bottom: 15px;">
                        <!-- Lấy ảnh đầu tiên của variants hoặc hình măc định của product, tạm để text -->
                        <img th:if="${!product.images.isEmpty()}"
                            th:src="@{'/uploads/' + ${product.images.iterator().next().imageUrl}}"
                            style="max-width: 100%; max-height: 100%; object-fit: contain;" />
                        <span th:if="${product.images.isEmpty()}">👟</span>
                    </div>
                    <h4 style="margin: 0 0 10px 0; font-size: 1em;" th:text="${product.productName}">Tên sản phẩm</h4>
                    <p style="margin: 0; font-size: 0.9em; color: #666;">Hãng: <span
                            th:text="${product.brandName}"></span></p>
                    <p class="price" th:if="${!product.variants.isEmpty()}"
                        th:text="${#numbers.formatDecimal(product.variants.iterator().next().price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
